<div class="login-page-wrapper">
  <div class="w-config">
    <header class="header">
      <img
        class="logo"
        alt="Logo Tuking"
        src="https://horizons-cdn.hostinger.com/423dd325-19b9-498f-b316-8ed9e10ea3c7/19fe4aab5350bff3f8d9f0fb6152001a.png"
      />
      <h1 class="title-page-login">Welcome!</h1>
      <p class="subtitle-page-login">Where communication takes flight</p>
    </header>
    <mat-card class="login-card">
      <mat-card-header>
        <mat-card-title class="login-card-title">Login</mat-card-title>
        <mat-card-subtitle class="login-card-subtitle"
          >Acesse sua conta para continuar</mat-card-subtitle
        >
      </mat-card-header>

      <mat-card-content>
        <form
          [formGroup]="loginForm"
          (ngSubmit)="onSubmit()"
          class="login-form"
        >
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input
              matInput
              type="email"
              formControlName="email"
              placeholder="seu@email.com"
              autocomplete="email"
            />
            <mat-icon matSuffix>email</mat-icon>
            <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
              Email é obrigatório
            </mat-error>
            <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
              Por favor, insira um email válido
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Senha</mat-label>
            <input
              matInput
              [type]="hidePassword ? 'password' : 'text'"
              formControlName="password"
              placeholder="Sua senha"
              autocomplete="current-password"
            />
            <button
              mat-icon-button
              matSuffix
              type="button"
              (click)="hidePassword = !hidePassword"
              [attr.aria-label]="'Hide password'"
              [attr.aria-pressed]="hidePassword"
            >
              <mat-icon>{{
                hidePassword ? "visibility_off" : "visibility"
              }}</mat-icon>
            </button>
            <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
              Senha é obrigatória
            </mat-error>
            <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
              Senha deve ter pelo menos 6 caracteres
            </mat-error>
          </mat-form-field>

          <div class="form-actions">
            <button
              mat-raised-button
              color="primary"
              type="submit"
              [disabled]="loginForm.invalid || isLoading"
              class="login-button"
            >
              <mat-spinner
                *ngIf="isLoading"
                diameter="20"
                class="button-spinner"
              ></mat-spinner>
              <span *ngIf="!isLoading">Entrar</span>
              <span *ngIf="isLoading">Entrando...</span>
            </button>
          </div>

          <div class="error-message" *ngIf="errorMessage">
            <mat-icon color="warn">error</mat-icon>
            <span>{{ errorMessage }}</span>
          </div>
        </form>
      </mat-card-content>

      <mat-card-actions class="card-actions">
        <p class="register-link">
          Não tem uma conta?
          <a routerLink="/register" class="link">Criar conta</a>
        </p>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
